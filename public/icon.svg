<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sprint Room">
  <!-- Ultramarine squircle with the app's own gesture on it: a ticked box. The
       geometry is the same as scripts/generate-icons.mjs draws, so the vector and
       the raster icons are one mark rather than two. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a55e0"/>
      <stop offset="100%" stop-color="#2340c9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#g)"/>
  <path
    d="M148.48 266.24 222.72 340.48 368.64 179.2"
    fill="none"
    stroke="#ffffff"
    stroke-width="43.52"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
